<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Scrollspy</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Menu -->
    <nav id="navbar" class="navbar navbar-dark bg-dark px-3 sticky-top">
        <a class="navbar-brand" href="#">Meu Site</a>

        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link" href="#inicio">Início</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#sobre">Sobre</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#servicos">Serviços</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#contato">Contato</a>
            </li>
        </ul>
    </nav>

    <!-- Conteúdo monitorado pelo Scrollspy -->
    <main
        data-bs-spy="scroll"
        data-bs-target="#navbar"
        data-bs-smooth-scroll="true"
        tabindex="0"
    >

        <section id="inicio" class="secao bg-primary text-white">
            <div class="container">
                <h1>Inicio</h1>
                <p>
                    Inicio◜◡◝
                </p>
            </div>
        </section>

        <section id="sobre" class="secao bg-light">
            <div class="container">
                <h1>Sobre</h1>
                <p>
                    Sobre '-'
                </p>
            </div>
        </section>

        <section id="servicos" class="secao bg-success text-white">
            <div class="container">
                <h1>Serviços</h1>
                <p>
                    Serviços 'o'
                </p>
            </div>
        </section>

        <section id="contato" class="secao bg-warning">
            <div class="container">
                <h1>Contato</h1>
                <p>
                    Contato :D
                </p>

<div class="mt-5 mb-5">
    <a href="../progress.html" class="btn btn-secondary">
        ← Voltar para Progress
    </a>

    <a href="Spinners/Spinners.html" class="btn btn-primary">
        Próximo → Spinners
    </a>
</div>

            </div>
        </section>

    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
